[pytest]
# Where pytest looks for tests
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options:
#   -v          verbose (shows each test name)
#   --tb=short  shorter tracebacks
addopts = -v --tb=short

# Custom markers — declared so pytest doesn't warn about unknown markers
markers =
    incremental: subsequent tests in the class are skipped if any earlier one fails

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
